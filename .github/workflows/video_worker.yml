name: Epic Automate Video Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Firestore Job ID"
        required: true
        type: string
      firebase_project_id:
        description: "Firebase Project ID"
        required: false
        default: "epic-studio-94147"
        type: string
      hf_dataset_repo:
        description: "Hugging Face Dataset Repo"
        required: false
        default: "felizzy/epic-automation-assets"
        type: string
      hf_token:
        description: "Hugging Face Access Token"
        required: false
        default: ""
        type: string
      nvidia_api_key:
        description: "NVIDIA NIM API Key"
        required: false
        default: ""
        type: string

jobs:
  render_video:
    name: Generate Video Scene Sequence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies (FFmpeg & Espeak-ng)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir kokoro>=0.9.4 soundfile huggingface_hub requests pillow numpy

      - name: Run Video Automation Pipeline
        env:
          FIREBASE_PROJECT_ID: ${{ github.event.inputs.firebase_project_id }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          HF_DATASET_REPO: ${{ github.event.inputs.hf_dataset_repo }}
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          NVIDIA_API_KEY: ${{ github.event.inputs.nvidia_api_key }}
        run: |
          python pipeline_executor.py
